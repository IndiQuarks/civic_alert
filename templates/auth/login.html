{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="container py-5 d-flex justify-content-center">
  <div style="width:100%;max-width:420px">
    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-3"
           style="width:60px;height:60px;background:var(--mint)">
        <i class="bi bi-shield-lock-fill fs-3 text-ca"></i>
      </div>
      <h2 class="page-title mb-1">Welcome back</h2>
      <p class="page-sub">Sign in to your CivicAlert account</p>
    </div>
    <div class="card p-4">
      <form method="POST">
        <div class="mb-3">
          <label class="form-label">Email address</label>
          <div class="input-group">
            <span class="input-group-text" style="background:var(--mint);border-color:var(--border)">
              <i class="bi bi-envelope text-ca"></i>
            </span>
            <input type="email" name="email" class="form-control" required autofocus placeholder="you@example.com" style="border-left:none">
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <div class="input-group">
            <span class="input-group-text" style="background:var(--mint);border-color:var(--border)">
              <i class="bi bi-lock text-ca"></i>
            </span>
            <input type="password" name="password" id="passwordInput" class="form-control" required placeholder="••••••••" style="border-left:none;border-right:none">
            <button type="button" class="input-group-text" style="background:var(--mint);border-color:var(--border);cursor:pointer" onclick="togglePw()">
              <i class="bi bi-eye" id="eyeIcon" style="color:var(--teal-soft)"></i>
            </button>
          </div>
        </div>
        <div class="mb-4 form-check">
          <input type="checkbox" name="remember" class="form-check-input" id="remember">
          <label class="form-check-label small" for="remember" style="color:var(--text-mid)">Keep me signed in</label>
        </div>
        <button class="btn-primary-ca w-100 justify-content-center" style="border-radius:10px;padding:.65rem">
          <i class="bi bi-box-arrow-in-right"></i> Sign In
        </button>
      </form>
      <hr class="section-divider">
      <p class="text-center small mb-0" style="color:var(--text-mid)">
        No account yet? <a href="{{ url_for('auth.register') }}" class="fw-600">Register for free</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
function togglePw() {
  const inp = document.getElementById('passwordInput');
  const icon = document.getElementById('eyeIcon');
  if (inp.type === 'password') { inp.type = 'text'; icon.className = 'bi bi-eye-slash'; }
  else { inp.type = 'password'; icon.className = 'bi bi-eye'; }
}
</script>
{% endblock %}
